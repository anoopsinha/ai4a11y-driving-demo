<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive</title>
<style>
  :root { --bg: #14161a; --fg: #f2f2f2; --muted: #a9adb5; --line: #2b2f36; --accent: #ffd34d; --warn: #ff5c5c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 12px 16px 32px; }
  h1 { font-size: 1.1em; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; }
  #hud { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 16px; padding: 10px 14px; font-weight: 700; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #hud span { background: rgba(0,0,0,.35); padding: 2px 8px; border-radius: 6px; }
  #hud span:empty, #hud span[hidden] { display: none; }
  #cues { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; pointer-events: none; font-size: 2.2em; font-weight: 800; text-shadow: 0 2px 4px #000; min-height: 1.3em; }
  #cues.warn { color: var(--warn); }
  #caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 14px; background: rgba(0,0,0,.7); font-size: 1.15em; min-height: 1.3em; text-align: center; }
  #caption:empty { display: none; }
  .bar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .bar form { display: flex; gap: 8px; flex: 1 1 360px; }
  input[type=text] { flex: 1; font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #1d2026; color: inherit; }
  button { font: inherit; padding: 9px 13px; border: 1px solid var(--line); border-radius: 8px; background: #1d2026; color: inherit; cursor: pointer; }
  button[aria-pressed=true] { background: var(--accent); color: #000; border-color: var(--accent); }
  label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  #reply { margin-top: 10px; min-height: 1.4em; }
  #profile { color: var(--muted); font-size: 0.9em; min-height: 1.2em; }
  .keys { color: var(--muted); font-size: 0.9em; margin-top: 10px; }
  kbd { background: #1d2026; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Drive — a track you can play by sight, by ear, or by voice</h1>

  <div class="stage">
    <canvas id="game" width="800" height="500" aria-label="The road ahead, drawn as a picture. The game also speaks and sounds what is happening." role="img"></canvas>
    <div id="hud" aria-hidden="true">
      <span id="hud-speed">0 mph</span>
      <span id="hud-lap">Lap 1</span>
      <span id="hud-time">0:00.0</span>
      <span id="hud-best"></span>
    </div>
    <div id="cues" aria-hidden="true"></div>
    <div id="caption" aria-hidden="true"></div>
  </div>

  <div class="bar">
    <form id="ask" aria-label="Tell the game what you need, or give it a command">
      <input id="text" type="text" autocomplete="off" placeholder='Say what you need — "I can&#39;t see the screen", "I get motion sick" — or a command'>
      <button id="mic" type="button" aria-pressed="false">🎤 Voice</button>
      <button type="submit">Send</button>
    </form>
    <label><input id="tts" type="checkbox" checked> Speak</label>
    <button id="pause" type="button">Pause</button>
  </div>

  <div id="reply" role="status" aria-live="polite"></div>
  <div id="alert" class="sr-only" role="alert" aria-live="assertive"></div>
  <div id="profile" aria-live="polite"></div>
  <p class="keys">Keys: <kbd>←</kbd> <kbd>→</kbd> steer · <kbd>↑</kbd> or <kbd>Space</kbd> accelerate · <kbd>↓</kbd> brake · <kbd>P</kbd> pause · <kbd>R</kbd> restart · <kbd>W</kbd> where am I · <kbd>Ctrl+Space</kbd> voice</p>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
